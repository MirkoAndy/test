name: Deploy Ribasso su GitHub Pages

on:
  push:
    branches:
      - claude/sharp-hamilton-3vk6w5
      - main
  workflow_dispatch:

# Permessi necessari al deploy su Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy alla volta; non annulla quelli in corso
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configura Pages
        uses: actions/configure-pages@v5
        with:
          # Abilita Pages automaticamente se non già attivo
          enablement: true

      - name: Carica l'artefatto
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
