<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06080c"><title>League of Leagues</title><style>html,body{margin:0;min-height:100%;background:#06080c;color:#fff;font-family:system-ui,-apple-system,sans-serif}body{display:grid;place-items:center}.wrap{text-align:center;padding:24px}.mark{font-size:44px;font-weight:900;color:#c8ff38;letter-spacing:.08em}.txt{margin-top:12px;color:#9eabb9;font-size:14px}</style></head><body><div class="wrap"><div class="mark">LØL</div><div class="txt">Loading League of Leagues…</div></div><script>(async()=>{try{const files=Array.from({length:8},(_,i)=>`./lol-exact/chunk${i}.txt`);const parts=await Promise.all(files.map(async u=>{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('Missing payload: '+u);return r.text()}));const b64=parts.join('').trim();const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);if(!('DecompressionStream' in window))throw new Error('Browser too old for this preview');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();const raw=new TextEncoder().encode(html);const digest=new Uint8Array(await crypto.subtle.digest('SHA-256',raw));const hex=[...digest].map(b=>b.toString(16).padStart(2,'0')).join('');const expected='37066100dc41c1a498cd180d5427ee7ea9b3babdb9406bd055f9672f22ca4f09';if(hex!==expected)throw new Error('Integrity check failed');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="wrap"><div class="mark">LØL</div><div class="txt">Preview load error: '+String(e.message).replace(/[&<>]/g,'')+'</div></div>'}})();</script></body></html>
